<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-Eye Test Portal — Scenario 05: Privacy Taxonomy Matrix</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">N-EYE LABORATORY SCENARIO 05</div>
      <h1>Privacy Taxonomy Matrix</h1>
      <p class="subtitle">Evaluates deterministic detection of passwords, OTPs, emails, phones, and API keys.</p>
    </header>

    <main class="card">
      <h2>Evaluation Form Fields</h2>
      <!-- WHY: A real same-document submit must change visible status and control state. Not an N-Eye success hook. -->
      <form id="privacy-eval-form" onsubmit="event.preventDefault(); (function () { var result = document.getElementById('privacy-result'); if (result) { result.hidden = false; result.textContent = 'Test context submitted.'; } var btn = document.getElementById('privacy-submit'); if (btn) { btn.disabled = true; btn.textContent = 'Test context submitted'; } })();">
        <div class="form-row">
          <label for="f-email">1. Direct PII: Email Address</label>
          <input type="email" id="f-email" placeholder="john.doe@company.org" value="john.doe@company.org">
        </div>

        <div class="form-row">
          <label for="f-phone">2. Direct PII: Phone Number</label>
          <input type="tel" id="f-phone" placeholder="+1-555-0199" value="+1-555-0199">
        </div>

        <div class="form-row">
          <label for="f-password">3. Authentication Secret: Account Password</label>
          <input type="password" id="f-password" value="CANARY_PASSWORD_SUPER_SECRET_999">
        </div>

        <div class="form-row">
          <label for="f-otp">4. One-Time Password / 2FA Code</label>
          <input type="text" id="f-otp" placeholder="Enter 6-digit OTP" value="CANARY_OTP_928441">
        </div>

        <div class="form-row">
          <label for="f-apikey">5. API Key / Bearer Secret</label>
          <input type="text" id="f-apikey" aria-label="API Key: sk_live_884910283948291039482910" value="sk_live_884910283948291039482910">
        </div>

        <div class="form-actions">
          <button type="submit" id="privacy-submit" class="btn btn-primary">Submit Test Context</button>
        </div>
      </form>
      <p id="privacy-result" class="alert-success" role="status" aria-live="polite" hidden></p>
    </main>

    <footer class="footer">
      <p><a href="./index.html" style="color: var(--primary);">← Back to Scenario 01</a></p>
    </footer>
  </div>
</body>
</html>
